  <text x="695" y="60" fill="#8B5CF6" font-family="monospace" font-size="12" text-anchor="middle">WEB / EVENT</text>

  <!-- Title footer -->
  <text x="400" y="410" fill="#F4F6FC" font-family="'Space Grotesk', sans-serif" font-size="22" font-weight="bold" text-anchor="middle">IT TECHFEST EVENT PORTAL</text>
