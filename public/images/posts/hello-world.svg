  </defs>
  <rect width="1200" height="630" fill="url(#g1)"/>
  <rect x="2" y="2" width="1196" height="626" stroke="#1F263B" stroke-width="2"/>
  
  <!-- Cyber Matrix Lines -->
  <path d="M0 120H1200M0 240H1200M0 360H1200M0 480H1200M200 0V630M400 0V630M600 0V630M800 0V630M1000 0V630" stroke="#1F263B" stroke-width="1" stroke-opacity="0.4"/>
  
