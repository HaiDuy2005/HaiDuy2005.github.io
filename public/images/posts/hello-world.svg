      <stop stop-color="#080A12"/>
      <stop offset="0.5" stop-color="#0E1322"/>
      <stop offset="1" stop-color="#141126"/>
    </linearGradient>
    <linearGradient id="textG" x1="200" y1="200" x2="800" y2="300" gradientUnits="userSpaceOnUse">
